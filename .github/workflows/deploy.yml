name: Deploy FOND
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /opt/fond
            git fetch origin
            git checkout main
            git reset --hard origin/main
            docker compose up -d --build
            sleep 5
            docker compose ps
            docker compose exec -T fond wget -qO- http://127.0.0.1:3000/api/health
