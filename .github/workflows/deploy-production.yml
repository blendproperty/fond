name: Promote FOND Production
on:
  workflow_dispatch:
    inputs:
      sha:
        description: Exact verified staging commit to promote
        required: true
        type: string
permissions:
  actions: read
  contents: read
concurrency:
  group: fond-production
  cancel-in-progress: false
jobs:
  deploy-production:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm this exact revision passed staging deployment
        uses: actions/github-script@v7
        env:
          PROMOTION_SHA: ${{ inputs.sha }}
        with:
          script: |
            const sha = process.env.PROMOTION_SHA;
            if (!/^[0-9a-f]{40}$/.test(sha)) {
              core.setFailed('A full 40-character commit SHA is required.');
              return;
            }
            const { data } = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'deploy.yml',
              head_sha: sha,
              status: 'completed',
            });
            if (!data.workflow_runs.some(run => run.conclusion === 'success')) {
              core.setFailed(`Revision ${sha} has no successful staging deployment.`);
            }
      - name: Promote the exact staging revision over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          VERIFIED_SHA: ${{ inputs.sha }}
        with:
          envs: VERIFIED_SHA
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /opt/fond
            git fetch origin
            test "$(git rev-parse origin/main)" = "$VERIFIED_SHA"
            git checkout main
            git reset --hard "$VERIFIED_SHA"
            docker compose build
            docker compose exec -T fond node -e 'const {DatabaseSync}=require("node:sqlite");const fs=require("node:fs");fs.mkdirSync("/app/data/backups",{recursive:true});const db=new DatabaseSync(process.env.FOND_DB_PATH);db.prepare("VACUUM INTO ?").run("/app/data/backups/pre-deploy-"+Date.now()+".sqlite");db.close();'
            docker compose up -d
            sleep 5
            docker compose ps
            docker compose exec -T fond wget -qO- http://127.0.0.1:3000/api/health
